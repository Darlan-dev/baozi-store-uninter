<line x1="110" y1="315" x2="65" y2="350" class="line"/>
<line x1="110" y1="315" x2="155" y2="350" class="line"/>
<line x1="110" y1="370" x2="70" y2="430" class="line"/>
<line x1="110" y1="370" x2="150" y2="430" class="line"/>
