<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
text{font-family:Arial,sans-serif;fill:#111} .title{font-size:28px;font-weight:bold}
.actor{font-size:20px} .uc{fill:#fff;stroke:#111;stroke-width:2}.sys{fill:#f6f6f6;stroke:#111;stroke-width:2}
.line{stroke:#111;stroke-width:2}
</style>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="45" text-anchor="middle" class="title">Diagrama de Caso de Uso — Baozi Store</text>
<rect x="250" y="80" width="900" height="640" class="sys"/>
<text x="700" y="115" text-anchor="middle" font-size="22" font-weight="bold">API REST Baozi Store</text>
<circle cx="110" cy="260" r="28" fill="none" stroke="#111" stroke-width="3"/>
